# `epresso dev` runs this environment (development), merged on top of site.toml.
# Show draft (_example) and _private (_example) pages in the dev server so the
# status badges are easy to inspect. Production keeps them hidden via site.toml.

[content]
show_drafts  = true
show_private = true

# Show build provenance (environment + epresso version) in the dev server's
# footer. `debug` may also be a table of extra rows, e.g. { commit = "abc1234" }.
[theme.footer]
debug = true
