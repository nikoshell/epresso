plugins = ["epresso_pandoc", "epresso_mkdocs_tabs"]

[site]
name = "epresso"
url = "https://epresso.top/"
language = "en"
description = "A modern, Python-first static site generator. Routes-as-code, content collections, deterministic + incremental builds, and a no-JavaScript-by-default philosophy."
repository = "https://github.com/nikoshell/epresso"
branch = "main"

[build]
trailing_slash = "always"
# Off: the host gzips/brotlis the response anyway, and gzip removes the same
# whitespace — on a 997-page corpus minify_html cost ~9 s of the build (19 %)
# for ~1 % of the transfer size (35.9 -> 36.3 MB gz).
compress_html = false
components = "components"
layouts = "layouts"
# Public base stays at the root: production is served from the custom domain
# https://epresso.top/, so root-relative URLs need no prefix. (A project GitHub
# Pages path would set EPRESSO_BASE — see .github/workflows/deploy-docs.yml.)

[content]
# Production build: hide draft / _private pages (demo pages are draft/private).
# site.development.toml overrides these so `epresso dev` still previews them.
show_drafts  = false
show_private = false

[search]
enabled = true
index = "search-index.json"

[markdown]
components = ["Highlight"]  # render fenced code blocks server-side
code_component = "Highlight"

[seo.rss]
# Disabled: docs are served at their flattened path; the rss url_template can't
# express that. A theme-owned feed endpoint would be needed to fix this.
enabled = false
collection = "docs"
path = "/rss.xml"
url_template = ""

[theme]
# Which subdir of the source repo holds the docs (e.g. "docs" or "_posts").
# Override with the EPRESSO_DOCS_DIR env var.
docs_dir = "docs"
# Page actions (copy page + markdown menu) are on by default; set this to
# false to hide the button/menu and drop the per-page .md routes too.
# page_actions = false
# Sidebar: once the nav has more rows than this (directories + pages), the
# top-level sections fold — the section holding the current page stays open.
# Raise it for a wider tree, lower it to fold sooner.
nav_collapse_after = 50
# The repo this theme documents when run at its own directory (self-build), as a
# path relative to this theme dir. No parent-walking: it's an explicit declaration.
repo = "../.."

# Optional footer menu (middle column of the footer grid). Relative hrefs get
# the build base; absolute (http…) hrefs are used as-is.
[theme.footer]
# menu = [
#   { label = "Documentation", href = "/" },
#   { label = "GitHub", href = "https://github.com/nikoshell/epresso" },
# ]

# Old paths from before the docs tree was reordered (2026-09-22): the section
# "Develop and build" folded into "Build & tooling", and "Editor setup" moved
# under Guides. Redirects keep the published URLs working.
[[redirects]]
"/develop-and-build/" = "/guides/build/commands/"

[[redirects]]
"/develop-and-build/cli/" = "/reference/cli/"

[[redirects]]
"/editor-setup/" = "/guides/editor-setup/"

# Sections are groups of pages, not landing pages: their README.md landings were
# removed (2026-09-22), so each old section URL points at its first page.
[[redirects]]
"/basics/" = "/basics/project-structure/"

[[redirects]]
"/concepts/" = "/concepts/why-epresso/"

[[redirects]]
"/guides/" = "/guides/content/markdown/"

[[redirects]]
"/guides/content/" = "/guides/content/markdown/"

[[redirects]]
"/guides/styling/" = "/guides/styling/styling/"

[[redirects]]
"/guides/build/" = "/guides/build/commands/"

[[redirects]]
"/guides/extending/" = "/guides/extending/layers/"

[[redirects]]
"/guides/behavior/" = "/guides/behavior/prefetch/"

[[redirects]]
"/guides/themes/" = "/guides/themes/new-website/"

[[redirects]]
"/reference/" = "/reference/template-directives/"
