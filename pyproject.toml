[project]
name = "epresso"
version = "0.2.0"
description = "epresso — a modern, Python-first static site generator. Routes-as-code, content collections, deterministic + incremental builds."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pygments>=2.17",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "websockets>=12.0",  # WebSocket live-reload support for uvicorn
    "watchfiles>=0.21",
    "tinycss2>=1.5.1",
]

[project.scripts]
epresso = "epresso.cli:main"

[project.optional-dependencies]
fmt = ["ruff>=0.5", "djhtml>=1.4", "cssbeautifier>=1.14", "jsbeautifier>=1.14"]
images = ["pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-snapshot",
    "httpx>=0.27",
    "ruff>=0.5",
    "pyright>=1.1.360",
    "pillow>=10.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epresso"]

[tool.hatch.build.targets.sdist]
include = ["src/epresso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["themes", "src/epresso/themes", "**/__pycache__", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # test fixture template strings are intentionally long
"src/epresso/cli.py" = ["B008", "E501"]  # Typer default-arg pattern + long template strings
"src/epresso/docsgen.py" = ["E501"]  # the bundled default docs layout is single-line HTML
"src/epresso/routing.py" = ["E501"]  # long f-string error messages
"src/epresso/content/loaders.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
exclude = ["src/epresso/themes", "themes"]
