name: Deploy Docs

# Builds the docs site (themes/docs, which reads the repo's `docs/`) and
# deploys the static output to GitHub Pages.
#
# Requires GitHub Pages to be enabled for the repo:
#   Settings → Pages → Source: "GitHub Actions".
#
# NOTE: the docs theme emits root-relative URLs (e.g. /assets/…). Production is
# served at the custom domain https://epresso.top/ (root base), so no
# EPRESSO_BASE prefix is needed. Configure the domain under
# Settings → Pages → Custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Production Pages lives only in the production repository. The development
    # repo has no Pages site, so skip there (its docs go to the preview repo
    # via docs-dev.yml instead).
    if: ${{ github.repository == (vars.PRODUCTION_REPO || 'nikoshell/epresso') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build docs site
        run: uv run --project . epresso build themes/docs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: themes/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
