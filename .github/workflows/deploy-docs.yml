name: Deploy Docs

# Builds the docs site (themes/docs, which reads the repo's `docs/`) and
# deploys the static output to GitHub Pages.
#
# Requires GitHub Pages to be enabled for the repo:
#   Settings → Pages → Source: "GitHub Actions".
#
# NOTE: the docs theme emits root-relative URLs (e.g. /assets/…). These work on
# a User/Organization Pages site or a custom domain. On a project Pages site
# (https://<user>.github.io/<repo>/), set a custom domain or add `[build] base`
# support to epresso first.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build docs site
        run: uv run --project . epresso build themes/docs
        env:
          EPRESSO_BASE: /epresso/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: themes/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
