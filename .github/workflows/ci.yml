name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev --python 3.13

      - name: Lint (Ruff)
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check src plugins

      - name: Type check (Pyright)
        run: uv run pyright src/epresso plugins

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=epresso --cov-report=term-missing -q

      - name: Verify install + quickstart
        run: |
          set -e
          rm -rf /tmp/epresso-smoke && mkdir -p /tmp/epresso-smoke && cd /tmp/epresso-smoke
          uv run --project ${{ github.workspace }} epresso init .
          uv run --project ${{ github.workspace }} epresso build .
          test -f dist/index.html && echo "smoke build OK"

      - name: Verify the built package (sdist → wheel) renders docs
        run: |
          set -e
          uv build -o /tmp/epresso-dist
          uv venv /tmp/epresso-pkg
          uv pip install --python /tmp/epresso-pkg/bin/python /tmp/epresso-dist/*.whl
          rm -rf /tmp/epresso-md && mkdir -p /tmp/epresso-md/docs && cd /tmp/epresso-md
          printf '# Hello\n\nFrom a bare dir.\n' > docs/index.md
          /tmp/epresso-pkg/bin/epresso docs . --out /tmp/epresso-md/out
          grep -q "From a bare dir" out/index.html && echo "installed epresso docs OK"

  perf:
    name: build-time regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Pinned to the interpreter scripts/perf_baseline.json was recorded on.
          # The gate compares ratios, which shift when the interpreter does; a
          # mismatch makes the run report-only rather than fail.
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --python 3.12

      - name: Measure (regression gate)
        run: |
          mkdir -p perf
          uv run --python 3.12 python scripts/bench.py --runs 3 --json perf/bench.json | tee perf/bench.log

      - name: Flame graph (informational)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p perf
          uv run --python 3.12 py-spy record --format flamegraph \
            --output perf/flame.svg -- python -m epresso build themes/docs

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf
          path: perf/
          if-no-files-found: ignore

  bench:
    name: render benchmarks (200 pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev --python 3.13

      - name: Measure (200-page build + phase split)
        run: |
          uv run --python 3.13 python bench/run.py scale --sizes 200 --shape docs \
            --json bench/results.json --summary bench/summary.md | tee bench/bench.log

      # The summary carries a table plus a Mermaid pie of the phase split, which
      # GitHub renders on the run page. (Mermaid line/bar charts — xychart-beta —
      # are not supported by GitHub's pinned Mermaid version, hence the pie.)
      - name: Job summary (table + phase graph)
        if: always()
        run: |
          if [ -f bench/summary.md ]; then cat bench/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: |
            bench/results.json
            bench/summary.md
            bench/bench.log
          if-no-files-found: ignore
