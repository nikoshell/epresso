name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev --python 3.13

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Type check (Pyright)
        run: uv run pyright src/epresso

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=epresso --cov-report=term-missing -q

      - name: Verify install + quickstart
        run: |
          set -e
          rm -rf /tmp/epresso-smoke && mkdir -p /tmp/epresso-smoke && cd /tmp/epresso-smoke
          uv run --project ${{ github.workspace }} epresso init .
          uv run --project ${{ github.workspace }} epresso build .
          test -f dist/index.html && echo "smoke build OK"
