# PR documentation previews — PUBLISH (privileged).
#
# Triggered by completion of `Docs Preview Build` (unprivileged). `workflow_run`
# always executes THIS workflow's default-branch definition, so the
# `DOCS_PREVIEW_TOKEN` secret is never exposed to PR code. This job never checks
# out or executes the PR's source; it only downloads the built static artifact
# and copies it into a dedicated preview Pages repository.
#
# Required repository variables:
#   DOCS_PREVIEW_REPO   owner/repo of the dedicated preview Pages repository
#   DOCS_PREVIEW_URL    full base URL previews are served from (no trailing slash)
#   DOCS_PREVIEW_BRANCH branch to publish to (default: gh-pages)
# Required secret:
#   DOCS_PREVIEW_TOKEN  token with contents:write on DOCS_PREVIEW_REPO
#                       (fine-grained PAT or GitHub App installation token)
name: Docs Preview Publish

on:
  workflow_run:
    workflows: ["Docs Preview Build"]
    types: [completed]

permissions:
  actions: read # download artifacts from the triggering run
  contents: read
  issues: write # create/update/delete the PR preview comment
  pull-requests: write # read PR state/head, comment on PRs

# Serialize publishes per PR so two updates to the same PR cannot corrupt each
# other. Cross-PR pushes to the shared preview branch are handled by a
# fetch/rebase/push retry below.
concurrency:
  group: docs-preview-publish-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download preview metadata
        id: meta
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-preview-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .preview

      - name: Resolve PR, validate, and decide action
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          pr=""
          action="build"
          if [ -f .preview/meta.json ]; then
            pr="$(jq -r '.pr // empty' .preview/meta.json)"
            action="$(jq -r '.action // "build"' .preview/meta.json)"
          fi
          if ! [[ "${pr:-}" =~ ^[0-9]+$ ]]; then
            pr="${EVENT_PR:-}"
          fi
          if ! [[ "${pr:-}" =~ ^[0-9]+$ ]]; then
            echo "::warning::Could not determine a PR number for run ${{ github.event.workflow_run.id }}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tie the claimed PR number to the trusted workflow_run event: the PR's
          # head commit must be exactly the commit this run was built from. This
          # makes a tampered metadata artifact useless (it can only name the PR
          # that actually produced this run).
          pr_head="$(gh api "repos/${repo}/pulls/${pr}" --jq '.head.sha' 2>/dev/null || true)"
          state="$(gh api "repos/${repo}/pulls/${pr}" --jq '.state' 2>/dev/null || true)"
          if [ -z "$pr_head" ] || [ "$(echo "$pr_head" | tr 'A-Z' 'a-z')" != "$(echo "$HEAD_SHA" | tr 'A-Z' 'a-z')" ]; then
            echo "::warning::PR #$pr head does not match run head ${HEAD_SHA}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$state" = "closed" ] || [ "$action" = "closed" ]; then
            action="cleanup"
          else
            action="publish"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          echo "action=${action}" >> "$GITHUB_OUTPUT"

      - name: Download built site
        if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.action == 'publish'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-preview-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: site

      - name: Validate configuration
        if: steps.resolve.outputs.skip == 'false'
        env:
          PREVIEW_REPO: ${{ vars.DOCS_PREVIEW_REPO }}
          PREVIEW_URL: ${{ vars.DOCS_PREVIEW_URL }}
          PREVIEW_TOKEN: ${{ secrets.DOCS_PREVIEW_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for v in PREVIEW_REPO PREVIEW_URL PREVIEW_TOKEN; do
            if [ -z "${!v:-}" ]; then echo "::error::Missing required value: $v"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Publish or remove preview
        if: steps.resolve.outputs.skip == 'false'
        env:
          PREVIEW_REPO: ${{ vars.DOCS_PREVIEW_REPO }}
          PREVIEW_BRANCH: ${{ vars.DOCS_PREVIEW_BRANCH }}
          PREVIEW_TOKEN: ${{ secrets.DOCS_PREVIEW_TOKEN }}
          ACTION: ${{ steps.resolve.outputs.action }}
          PR: ${{ steps.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          branch="${PREVIEW_BRANCH:-gh-pages}"
          dir="pr-${PR}"

          # Keep the token out of logs and command lines.
          git config --global url."https://x-access-token:${PREVIEW_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf preview-repo
          git clone --depth 1 --branch "$branch" \
            "https://github.com/${PREVIEW_REPO}.git" preview-repo 2>/dev/null \
            || {
              # Branch does not exist yet: start an orphan branch.
              mkdir -p preview-repo
              git -C preview-repo init -q
              git -C preview-repo checkout -q --orphan "$branch"
              git -C preview-repo remote add origin "https://github.com/${PREVIEW_REPO}.git"
            }

          cd preview-repo
          git fetch --depth 1 origin "$branch" 2>/dev/null || true

          if [ "$ACTION" = "publish" ]; then
            rm -rf "$dir"
            mkdir -p "$dir"
            if [ -d "${GITHUB_WORKSPACE}/site" ]; then
              # Copy static files only. The artifact is untrusted: strip symlinks
              # (and any link escaping the tree) so nothing can point outside $dir.
              find "${GITHUB_WORKSPACE}/site" -type l -delete
              cp -a "${GITHUB_WORKSPACE}/site/." "$dir/"
              rm -rf "$dir/.git" # never let untrusted input nest a repo
            else
              echo "::error::Built site artifact is missing; nothing to publish."
              exit 1
            fi
          else
            rm -rf "$dir"
          fi

          # GitHub Pages "deploy from a branch" runs Jekyll, which ignores
          # underscore-prefixed paths — that would drop _scoped/ and _epresso/.
          : > .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -q -m "docs preview: $ACTION ${dir}"

          # Cross-PR pushes to the shared branch can race; retry with a rebase.
          for attempt in 1 2 3; do
            if git push origin "$branch" 2>/dev/null; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing and retrying."
            git pull --rebase origin "$branch" || true
            sleep 3
          done
          echo "::error::Failed to push preview after retries."
          exit 1

      - name: Comment on PR
        if: steps.resolve.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ vars.DOCS_PREVIEW_URL }}
          PR: ${{ steps.resolve.outputs.pr }}
          ACTION: ${{ steps.resolve.outputs.action }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          marker="<!-- docs-preview -->"

          if [ "$ACTION" = "cleanup" ]; then
            # Remove every preview comment for this PR.
            gh api "repos/${repo}/issues/${PR}/comments" --paginate \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
              | while read -r id; do
                  gh api -X DELETE "repos/${repo}/issues/comments/${id}" || true
                done
            exit 0
          fi

          url="${PREVIEW_URL%/}/pr-${PR}/"
          # Build the body without leading indentation (a YAML block scalar would
          # otherwise turn the continuation lines into a Markdown code block).
          body="$(printf '%s\n## \xf0\x9f\x93\x96 Documentation preview\n\n**[Open the preview \xe2\x86\x92](%s)**\n\n%s\n\n_Preview of this pull request \xe2\x80\x94 updated on each push, removed when the PR is closed._\n' "$marker" "$url" "$url")"

          existing="$(gh api "repos/${repo}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1 || true)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${repo}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api "repos/${repo}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi
