# PR documentation previews — BUILD (unprivileged).
#
# This workflow only *builds* the PR's documentation and uploads the result as
# an artifact. It runs with a read-only token and NO secrets, so untrusted code
# from fork PRs can never reach a deployment credential. Publishing happens in
# `preview-publish.yml`, which is triggered via `workflow_run` and always uses
# the trusted default-branch definition of that workflow.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   DOCS_PREVIEW_REPO  owner/repo of the dedicated preview Pages repository (REQUIRED)
#   DOCS_PREVIEW_URL   full base URL previews are served from, no trailing slash
#                      (REQUIRED), e.g. https://nikoshell.github.io/epresso-preview
#                      or a custom domain like https://preview.epresso.dev
#   DOCS_PREVIEW_BRANCH  branch in the preview repo to publish to (default: gh-pages)
#
# Secret (used only by preview-publish.yml, never here):
#   DOCS_PREVIEW_TOKEN  token with contents:write on DOCS_PREVIEW_REPO
name: Docs Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's actual source, not main and not the base branch tip.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Compute preview base
        id: base
        env:
          PREVIEW_URL: ${{ vars.DOCS_PREVIEW_URL }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "::error::Repository variable DOCS_PREVIEW_URL is not set."
            exit 1
          fi
          url="${PREVIEW_URL%/}"
          prefix="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).path.rstrip("/"))' "$url")"
          echo "base=${prefix}/pr-${PR}/" >> "$GITHUB_OUTPUT"

      - name: Build docs site
        # Same command as production; EPRESSO_BASE makes every root-relative URL
        # (assets, scripts, internal links, CSS url()) resolve under the preview.
        env:
          EPRESSO_BASE: ${{ steps.base.outputs.base }}
        run: uv run --project . epresso build themes/docs

      - name: Write preview metadata
        run: |
          set -euo pipefail
          mkdir -p .preview-meta
          printf '{"pr":%s,"action":"build","sha":"%s"}\n' \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" > .preview-meta/meta.json

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-site
          path: themes/docs/dist
          retention-days: 7
          if-no-files-found: error

      - name: Upload preview metadata
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-meta
          path: .preview-meta/meta.json
          retention-days: 7
          if-no-files-found: error

  closed:
    # The privileged publish workflow runs on `workflow_run` and detects the
    # closed state via the API, so this job only needs to make the workflow run
    # exist (and it is safe: no secrets, read-only token).
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Write preview metadata
        run: |
          set -euo pipefail
          mkdir -p .preview-meta
          printf '{"pr":%s,"action":"closed"}\n' \
            "${{ github.event.pull_request.number }}" > .preview-meta/meta.json

      - name: Upload preview metadata
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-meta
          path: .preview-meta/meta.json
          retention-days: 7
          if-no-files-found: error
